services:
  # Document converter application
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfiles_converter
    runtime: nvidia
    environment:
      - OLLAMA_HOST=http://100.66.178.79:11434  # ubuntu-ms-7e62 Tailscale IP (MagicDNS names do not resolve inside containers)
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Web UI for document conversion
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfiles_web
    command: python src/web_app.py
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "3143:3143"
    environment:
      - OLLAMA_HOST=http://100.66.178.79:11434  # ubuntu-ms-7e62 Tailscale IP (MagicDNS names do not resolve inside containers)
      - PYTHONUNBUFFERED=1
      - APP_PORT=3143
      - NVIDIA_VISIBLE_DEVICES=all
      - DOCLING_DEVICE=cuda
    volumes:
      - ./output:/app/output
      - ./config:/app/config
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

